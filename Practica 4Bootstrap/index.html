<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase: Componentes Básicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="bg-white p-4 rounded shadow">
            <h2 class="mb-4">Panel de Control</h2>

            <div class="alert alert-info" role="alert">
                Tienes <strong>3 mensajes</strong> nuevos en tu bandeja de entrada. [cite: 18, 19]
            </div>
            
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                ¡Tu perfil se ha actualizado correctamente! [cite: 19]
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button> [cite: 20]
            </div>

            <hr class="my-4">

            <div class="mb-4">
                <h4 class="d-inline-block me-2">Mensajes</h4> [cite: 20]
                <span class="badge bg-primary">12</span> [cite: 20]
                <span class="badge rounded-pill bg-danger">Nuevo</span> [cite: 20]
                <span class="badge bg-warning text-dark">Pendiente</span> [cite: 20]
            </div>

            <hr class="my-4">

            <div class="d-grid gap-2 d-md-block"> [cite: 20]
                <button class="btn btn-primary" type="button">Enviar Reporte</button> [cite: 20]
                <button class="btn btn-outline-secondary" type="button">Cancelar</button> [cite: 20]
                <button class="btn btn-danger" type="button"> [cite: 20]
                    Eliminar <span class="badge bg-white text-danger">5</span> [cite: 20]
                </button> [cite: 20]
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> [cite: 20]
</body>
</html>
